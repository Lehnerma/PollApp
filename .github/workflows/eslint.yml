name: ESLint (TypeScript-Qualitaet & Dateistruktur)

on:
  push:
    # branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eslint:
    name: TypeScript-Qualitaet & Dateistruktur (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
