<ul [class]="listLayout()" class="card__container">
  @for (item of surveyList(); track item.id) {
    <li class="card">
      <button class="card__btn" [routerLink]="['fillout', item.id]">
        <span class="card__category">{{ item.category }}</span>
        <span class="card__title">{{ item.survey_name }}</span>
        <span class="card__expire">Ends in {{ getExpireDay(item.expires_at) }} Days</span>
      </button>
    </li>
  }
</ul>
