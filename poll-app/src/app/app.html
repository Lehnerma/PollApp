<router-outlet />

<dialog #createSurveyDialog (cancel)="closeCreateSurveyDialog()" (close)="closeCreateSurveyDialog()" class="create-survey-dialog">
  @if (isCreateSurveyOpen()) {
    <div class="dialog__container">
      <main-header class="dialog__header" (logoClick)="closeCreateSurveyDialog()"></main-header>
      <survey-create-component (closed)="closeCreateSurveyDialog()" />
    </div>
  }
</dialog>
